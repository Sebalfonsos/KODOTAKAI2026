<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1122" height="1402" viewBox="0 0 1122 1402" role="img"
  aria-labelledby="titulo descripcion" data-state="escuchando" id="ruti">
<title id="titulo">RUTI, mascota asistente de logística</title>
<desc id="descripcion">Mascota amigable vectorial con un pin de ubicación, visor expresivo, manos y cuerpo de paquete. Sus componentes están separados en capas para animación.</desc>
<defs>
 <linearGradient id="teal" x1="0.08" y1="0.06" x2="0.9" y2="1"><stop stop-color="#75f5e9"/><stop offset="0.32" stop-color="#22cbbf"/><stop offset="0.71" stop-color="#07a39e"/><stop offset="1" stop-color="#006c80"/></linearGradient>
 <linearGradient id="tealOscuro" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23c9c3"/><stop offset=".55" stop-color="#03969d"/><stop offset="1" stop-color="#07546e"/></linearGradient>
 <linearGradient id="blanco" x1="0.1" y1="0" x2="0.85" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#e0faff"/><stop offset=".81" stop-color="#aadadd"/><stop offset="1" stop-color="#73b8c5"/></linearGradient>
 <linearGradient id="azulOscuro" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b4761"/><stop offset=".5" stop-color="#102c4a"/><stop offset="1" stop-color="#091929"/></linearGradient>
 <linearGradient id="visorGradient" x1="0.1" y1="0" x2="0.9" y2="1"><stop stop-color="#10354e"/><stop offset=".5" stop-color="#061c34"/><stop offset="1" stop-color="#10253e"/></linearGradient>
 <linearGradient id="oro" x1="0.08" y1="0" x2="0.9" y2="1"><stop stop-color="#ffeb9a"/><stop offset=".28" stop-color="#ffca44"/><stop offset=".66" stop-color="#ffad12"/><stop offset="1" stop-color="#e77e0d"/></linearGradient>
 <linearGradient id="oroFranja" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fff1ae"/><stop offset=".35" stop-color="#ffd16d"/><stop offset=".85" stop-color="#efa32e"/><stop offset="1" stop-color="#df8419"/></linearGradient>
 <linearGradient id="ojosBlanco" x1="0.12" y1="0" x2="0.88" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9faff"/></linearGradient>
 <linearGradient id="iris" x1="0" y1="0" x2="0.3" y2="1"><stop stop-color="#0b2137"/><stop offset=".56" stop-color="#06394d"/><stop offset="1" stop-color="#08ddce"/></linearGradient>
 <radialGradient id="rubor"><stop stop-color="#f4b85c" stop-opacity=".31"/><stop offset="1" stop-color="#f4b85c" stop-opacity="0"/></radialGradient>
 <filter id="sombraSutil" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style><![CDATA[
/* Cambia el atributo data-state del SVG raíz para ver estados. */
#ojos_cerrados, #boca_pensando, #boca_resuelto, #boca_preocupada,
#indicador_pensando, #indicador_resuelto, #indicador_escalamiento,
#indicador_error { display:none; }
svg[data-state="pensando"] #boca_normal,
svg[data-state="resuelto"] #boca_normal,
svg[data-state="escalamiento"] #boca_normal,
svg[data-state="error"] #boca_normal { display:none; }
svg[data-state="pensando"] #boca_pensando { display:inline; }
svg[data-state="resuelto"] #boca_resuelto { display:inline; }
svg[data-state="escalamiento"] #boca_preocupada,
svg[data-state="error"] #boca_preocupada { display:inline; }
svg[data-state="resuelto"] #ojos_abiertos { display:none; }
svg[data-state="resuelto"] #ojos_cerrados { display:inline; }
svg:not([data-state="escuchando"]) #indicador_escuchando { display:none; }
svg[data-state="pensando"] #indicador_pensando { display:inline; }
svg[data-state="resuelto"] #indicador_resuelto { display:inline; }
svg[data-state="escalamiento"] #indicador_escalamiento { display:inline; }
svg[data-state="error"] #indicador_error { display:inline; }
svg[data-state="pensando"] #pupila_izquierda,
svg[data-state="pensando"] #pupila_derecha { transform:translate(0px,-10px); }
svg[data-state="error"] #ceja_izquierda { transform:rotate(13deg); transform-origin:412px 432px; }
svg[data-state="error"] #ceja_derecha { transform:rotate(-13deg); transform-origin:671px 432px; }
]]></style>

